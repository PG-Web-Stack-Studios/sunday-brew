<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Menu — Sunday Brew Admin</title>
  <link rel="stylesheet" href="../styles.css">
  <script src="../config.js"></script>
  <script type="module" src="menu.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="site-title" href="./">Sunday Brew Admin</a>
      <nav class="site-nav" aria-label="Admin">
        <ul>
          <li><a href="./">Requests</a></li>
          <li><a href="events">Events</a></li>
          <li><a href="menu" aria-current="page">Menu</a></li>
          <li><a href="merch">Merch</a></li>
          <li><a href="settings">Settings</a></li>
          <li><a href="../">View site</a></li>
          <li><button id="logout" class="button button-secondary" type="button">Log out</button></li>
        </ul>
      </nav>
    </div>
  </header>

  <main hidden>
    <div class="container">
      <h1>Menu</h1>
      <div class="tabs" role="tablist">
        <button class="button" type="button" data-menu="onsite">On-site</button>
        <button class="button button-secondary" type="button" data-menu="private">Private clients</button>
      </div>
      <p><button id="new-item" class="button" type="button">+ Add product</button></p>
      <div id="editor"></div>
      <div id="items" aria-live="polite"><p class="muted">Loading…</p></div>
    </div>
  </main>
</body>
</html>
