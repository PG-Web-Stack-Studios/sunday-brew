<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Us — Sunday Brew Coffee</title>
  <meta name="description" content="Book Sunday Brew Coffee for your private event or catering.">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script type="module" src="js/book.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="site-title" href="index.html">Sunday Brew Coffee</a>
      <nav class="site-nav" aria-label="Main">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="find-us.html">Find Us</a></li>
          <li><a href="menu.html">Menu</a></li>
          <li><a href="merch.html">Merch</a></li>
          <li><a href="book.html" aria-current="page">Book Us</a></li>
          <li><a href="resources.html">Resources</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <h1>Book Us</h1>
      <p>Tell us about your event and we'll get back to you with a quote.</p>

      <form id="booking-form" class="form" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" autocomplete="name" required maxlength="120">
        </div>
        <div class="row">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required maxlength="200">
          </div>
          <div class="field">
            <label for="phone">Phone</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="40">
          </div>
        </div>
        <div class="field">
          <label for="event_type">Type of event</label>
          <input id="event_type" name="event_type" placeholder="Wedding, corporate, birthday…" maxlength="120">
        </div>
        <div class="row">
          <div class="field">
            <label for="event_date">Event date</label>
            <input id="event_date" name="event_date" type="date">
          </div>
          <div class="field">
            <label for="event_time">Event time</label>
            <input id="event_time" name="event_time" placeholder="e.g. 9am – 12pm" maxlength="60">
          </div>
        </div>
        <div class="field">
          <label for="location">Event address or city</label>
          <input id="location" name="location" maxlength="200">
        </div>
        <div class="row">
          <div class="field">
            <label for="guest_count">Approx. number of guests</label>
            <input id="guest_count" name="guest_count" type="number" min="0" max="100000" inputmode="numeric">
          </div>
          <div class="field">
            <label for="service_type">Service</label>
            <select id="service_type" name="service_type">
              <option value="trailer">Coffee trailer on-site</option>
              <option value="cold_cans">Cold can delivery</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="message">Details</label>
          <textarea id="message" name="message" maxlength="3000"></textarea>
        </div>
        <div class="honeypot" aria-hidden="true">
          <label for="company">Company</label>
          <input id="company" name="company" tabindex="-1" autocomplete="off">
        </div>
        <p><button class="button" type="submit">Send request</button></p>
        <div id="form-status" aria-live="polite"></div>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Sunday Brew Coffee · Phoenix, Arizona · <a href="https://www.instagram.com/sundaybrewcoffee/">@sundaybrewcoffee</a></p>
    </div>
  </footer>
</body>
</html>
